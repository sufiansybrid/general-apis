<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Chat</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 720px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e5e5e0;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 800px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #e5e5e0;
      background: #fafaf8;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #63993a;
    }

    .dot.busy {
      background: #e8a020;
    }

    .dot.err {
      background: #cc4444;
    }

    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    select {
      font-size: 13px;
      padding: 5px 10px;
      border: 1px solid #d5d5d0;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
      outline: none;
    }

    select:focus {
      border-color: #888;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #999;
      font-size: 14px;
      text-align: center;
      padding: 40px;
    }

    .empty svg {
      opacity: 0.3;
      margin-bottom: 8px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      gap: 4px;
    }

    .msg.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-label {
      font-size: 11px;
      color: #aaa;
      padding: 0 4px;
    }

    .bubble {
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: #e8f0fe;
      color: #1a3a6e;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .bubble {
      background: #f5f5f0;
      color: #1a1a1a;
      border: 1px solid #e5e5e0;
      border-bottom-left-radius: 4px;
    }

    /* Typing */
    .typing-wrap {
      align-self: flex-start;
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 12px 16px;
      background: #f5f5f0;
      border: 1px solid #e5e5e0;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aaa;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-6px);
      }
    }

    /* Input area */
    .input-area {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid #e5e5e0;
      background: #fafaf8;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      border-radius: 10px;
      border: 1px solid #d5d5d0;
      background: #fff;
      color: #1a1a1a;
      line-height: 1.5;
      outline: none;
      overflow-y: auto;
    }

    textarea:focus {
      border-color: #888;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid #d5d5d0;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .send-btn:hover:not(:disabled) {
      background: #f0f0eb;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .send-btn svg {
      pointer-events: none;
    }

    /* Footer */
    .footer {
      font-size: 11px;
      color: #bbb;
      text-align: center;
      padding: 8px 20px 10px;
      background: #fafaf8;
      border-top: 1px solid #eee;
    }

    .footer a {
      color: #888;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Clear button */
    .clear-btn {
      font-size: 12px;
      color: #aaa;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .clear-btn:hover {
      background: #eee;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="dot" id="dot"></div>
        <span class="header-title">Claude Chat</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="clear-btn" id="clearBtn">Clear</button>
        <select id="modelSelect">
          <option value="claude-opus-4-8">Opus 4.8 — most capable</option>
          <option value="claude-opus-4-7">Opus 4.7</option>
          <option value="claude-sonnet-4-6" selected>Sonnet 4.6 — balanced</option>
          <option value="claude-opus-4-6">Opus 4.6</option>
          <option value="claude-haiku-4-5">Haiku 4.5 — fastest</option>
        </select>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="empty" id="emptyState">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        <strong style="color:#666; font-size:15px;">Start a conversation</strong>
        <span>Puter.js will ask you to sign in on your first message.<br>Create a free account at <a
            href="https://puter.com" target="_blank">puter.com</a></span>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <textarea id="msgInput" placeholder="Message Claude... (Enter to send, Shift+Enter for new line)"
        rows="1"></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>

    <div class="footer">
      Powered by <a href="https://developer.puter.com" target="_blank">Puter.js</a> — no API key needed &nbsp;·&nbsp;
      Users sign in with their free Puter account
    </div>

  </div>

  <!-- Puter.js — the only dependency -->
  <script src="https://js.puter.com/v2/"></script>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const modelSel = document.getElementById('modelSelect');
    const dot = document.getElementById('dot');
    const emptyState = document.getElementById('emptyState');
    const clearBtn = document.getElementById('clearBtn');

    let history = [];   // full conversation for context
    let loading = false;

    /* ── helpers ───────────────────────────────────────────── */

    function setStatus(state) {
      dot.className = 'dot' + (state === 'busy' ? ' busy' : state === 'err' ? ' err' : '');
    }

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(role, text) {
      emptyState.style.display = 'none';

      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;

      const label = document.createElement('div');
      label.className = 'msg-label';
      label.textContent = role === 'user' ? 'You' : modelSel.options[modelSel.selectedIndex].text.split(' —')[0];

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      wrap.appendChild(label);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollBottom();
      return bubble;
    }

    function showTyping() {
      const wrap = document.createElement('div');
      wrap.className = 'typing-wrap';
      wrap.id = 'typingEl';
      wrap.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(wrap);
      scrollBottom();
    }

    function removeTyping() {
      const t = document.getElementById('typingEl');
      if (t) t.remove();
    }

    /* ── send ──────────────────────────────────────────────── */

    async function send() {
      const text = inputEl.value.trim();
      if (!text || loading) return;

      loading = true;
      sendBtn.disabled = true;
      setStatus('busy');

      inputEl.value = '';
      inputEl.style.height = 'auto';

      addMessage('user', text);
      history.push({ role: 'user', content: text });

      showTyping();

      try {
        const model = modelSel.value;
        const response = await puter.ai.chat(history, { model, stream: true });

        removeTyping();

        const bubble = addMessage('assistant', '');
        let full = '';

        for await (const part of response) {
          if (part?.text) {
            full += part.text;
            bubble.textContent = full;
            scrollBottom();
          }
        }

        history.push({ role: 'assistant', content: full });
        setStatus('ok');

      } catch (err) {
        removeTyping();
        setStatus('err');
        addMessage('assistant', '⚠ ' + (err.message || 'Something went wrong. Make sure you are signed in to Puter.'));
      }

      loading = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }

    /* ── clear ─────────────────────────────────────────────── */

    clearBtn.addEventListener('click', () => {
      history = [];
      messagesEl.innerHTML = '';
      messagesEl.appendChild(emptyState);
      emptyState.style.display = '';
      setStatus('ok');
    });

    /* ── events ────────────────────────────────────────────── */

    sendBtn.addEventListener('click', send);

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });
  </script>

</body>

</html>
